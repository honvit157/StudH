server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        name: STUDYAPP_SESSION

spring:
  application:
    name: studyapp-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studyapp}
    username: ${SPRING_DATASOURCE_USERNAME:studyapp}
    password: ${SPRING_DATASOURCE_PASSWORD:studyapp_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  password: ${APP_PASSWORD:studyapp123}
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}
