server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        name: STUDYAPP_SESSION

spring:
  application:
    name: studyapp-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/studyapp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

app:
  password: ${APP_PASSWORD:studyapp123}
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}
