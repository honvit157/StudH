version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyapp
      POSTGRES_USER: studyapp
      POSTGRES_PASSWORD: studyapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyapp -d studyapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: studyapp_postgres_data
