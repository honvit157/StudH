services:
  db:
    image: postgres:16-alpine
    container_name: studyapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyapp
      POSTGRES_USER: studyapp
      POSTGRES_PASSWORD: studyapp_secret_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyapp -d studyapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyapp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_PASSWORD: ${APP_PASSWORD:-studyapp123}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/studyapp
      SPRING_DATASOURCE_USERNAME: studyapp
      SPRING_DATASOURCE_PASSWORD: studyapp_secret_pass
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_FLYWAY_ENABLED: "true"
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
